
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Procedural Music Engine</title>

<style>
body {
  background: #0f1116;
  color: white;
  font-family: sans-serif;
  text-align: center;
  margin: 0;
}

h1 {
  margin-top: 20px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

.control {
  display: flex;
  flex-direction: column;
  font-size: 12px;
  flex: 1 1 160px;   /* flexible width */
  max-width: 200px;
}

input,
select,
button {
  width: 100%;       /* fill container */
  padding: 8px;
  border-radius: 6px;
  border: none;
  background: #222;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #444;
}

canvas {
  background: #12161f;
  border-radius: 10px;
  margin-top: 20px;
  width: 95%;
  max-width: 1000px;
  height: 220px;
}

/* Tablet adjustments */
@media (max-width: 768px) {
  .controls {
    gap: 12px;
  }
  .control {
    max-width: 160px;
    font-size: 11px;
  }
  canvas {
    height: 180px;
  }
}

/* Mobile adjustments */
@media (max-width: 480px) {
  .controls {
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .control {
    width: 90%;       /* full width on mobile */
    max-width: none;
    font-size: 14px;
  }
  input,
  select,
  button {
    font-size: 14px;  /* larger tap targets */
    padding: 12px;
  }
  canvas {
    height: 150px;
  }
}

</style>
</head>

<body>

<h1>Procedural Music Engine 🎼</h1>

<canvas id="viz"></canvas>

<div class="controls">

<div class="control">
<label>Tempo</label>
<input id="tempo" type="range" min="60" max="160" value="90">
</div>

<div class="control">
<label>Randomness</label>
<input id="randomness" type="range" min="0" max="1" step="0.05" value="0.3">
</div>

<div class="control">
<label>Melody Density</label>
<input id="density" type="range" min="0" max="1" step="0.05" value="0.4">
</div>

<div class="control">
<label>Pad Volume</label>
<input id="pad" type="range" min="0" max="1" step="0.05" value="0.7">
</div>

<div class="control">
<label>Note Volume</label>
<input id="noteVol" type="range" min="0" max="1" step="0.05" value="0.25">
</div>

<div class="control">
<label>Chord Length</label>
<input id="chordLength" type="number" min="1" max="8" value="4">
</div>

<div class="control">
<label>Key</label>
<select id="key">
<option value="60">C</option>
<option value="62">D</option>
<option value="64">E</option>
<option value="65">F</option>
<option value="67">G</option>
<option value="69">A</option>
</select>
</div>

<div class="control">
<label>Scale</label>
<select id="scale">
<option value="major">Major</option>
<option value="minor">Minor</option>
<option value="dorian">Dorian</option>
<option value="pentatonic">Pentatonic</option>
</select>
</div>

<div class="control">
<label>Export Duration</label>
<input id="length" type="number" value="30">
</div>

<div class="control">
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="exportTrack()">Export WAV</button>
</div>

</div>

<script>

const audio=new (window.AudioContext||window.webkitAudioContext)()

const master=audio.createGain()
const filter=audio.createBiquadFilter()
const analyser=audio.createAnalyser()

filter.type="lowpass"
filter.frequency.value=2000

master.gain.value=0.8

filter.connect(master)
master.connect(analyser)
analyser.connect(audio.destination)

analyser.fftSize=256

const canvas=document.getElementById("viz")
const ctx=canvas.getContext("2d")

function resize(){
canvas.width=canvas.clientWidth
canvas.height=canvas.clientHeight
}
window.addEventListener("resize",resize)
resize()

const scales={
major:[0,2,4,5,7,9,11],
minor:[0,2,3,5,7,8,10],
dorian:[0,2,3,5,7,9,10],
pentatonic:[0,3,5,7,10]
}

const progressions=[
[0,4,5,3],
[0,3,4,0],
[5,3,0,4]
]

let running=false

function freq(m){return 440*Math.pow(2,(m-69)/12)}

function getScale(){

let root=parseInt(document.getElementById("key").value)
let type=document.getElementById("scale").value

return scales[type].map(n=>root+n)

}

function buildChords(scale){

return[
[scale[0],scale[2],scale[4]],
[scale[1],scale[3],scale[5]],
[scale[2],scale[4],scale[6]],
[scale[3],scale[5],scale[0]+12],
[scale[4],scale[6],scale[1]+12],
[scale[5],scale[0]+12,scale[2]+12]
]

}

function playNote(midi,time,duration,type,vol){

const osc=audio.createOscillator()
const gain=audio.createGain()
const pan=audio.createStereoPanner()

osc.type=type
osc.frequency.value=freq(midi)

pan.pan.value=(Math.random()*2-1)*0.4

osc.connect(gain)
gain.connect(pan)
pan.connect(filter)

gain.gain.setValueAtTime(0,time)
gain.gain.linearRampToValueAtTime(vol,time+0.02)
gain.gain.setValueAtTime(vol,time+duration-0.3)
gain.gain.exponentialRampToValueAtTime(0.0001,time+duration)

osc.start(time)
osc.stop(time+duration)

}

function generateBar(start){

const tempo=parseFloat(document.getElementById("tempo").value)
const beat=60/tempo

const density=parseFloat(document.getElementById("density").value)
const padVol=parseFloat(document.getElementById("pad").value)
const noteVol=parseFloat(document.getElementById("noteVol").value)
const randomness=parseFloat(document.getElementById("randomness").value)
const chordLen=parseFloat(document.getElementById("chordLength").value)

const scale=getScale()
const chords=buildChords(scale)

const prog=progressions[Math.floor(Math.random()*progressions.length)]
const chord=chords[prog[Math.floor(Math.random()*prog.length)]]

for(let n of chord)
playNote(n,start,chordLen*beat,"triangle",padVol)

playNote(chord[0]-12,start,chordLen*beat,"sawtooth",padVol*0.6)

for(let i=0;i<4;i++){

if(Math.random()<density){

let note

if(Math.random()>randomness)
note=chord[Math.floor(Math.random()*chord.length)]
else
note=scale[Math.floor(Math.random()*scale.length)]

playNote(note+12,start+i*beat,beat,"sine",noteVol)

}

}

}

function loop(){

if(!running)return

const tempo=parseFloat(document.getElementById("tempo").value)
const beat=60/tempo

generateBar(audio.currentTime)

setTimeout(loop,beat*4000)

}

function start(){
audio.resume()
running=true
loop()
visualize()
}

function stop(){running=false}

function visualize(){

const data=new Uint8Array(analyser.frequencyBinCount)

function draw(){

if(!running)return

analyser.getByteFrequencyData(data)

ctx.fillStyle="#0f1116"
ctx.fillRect(0,0,canvas.width,canvas.height)

const w=canvas.width/data.length

for(let i=0;i<data.length;i++){

let h=data[i]

ctx.fillStyle="hsl("+(i*3)+",80%,"+(40+h/4)+"%)"
ctx.fillRect(i*w,canvas.height-h,w,h)

}

requestAnimationFrame(draw)

}

draw()

}

function exportTrack(){

const seconds=parseInt(document.getElementById("length").value)
const tempo=parseFloat(document.getElementById("tempo").value)
const beat=60/tempo

const offline=new OfflineAudioContext(2,44100*seconds,44100)

const compressor=offline.createDynamicsCompressor()
compressor.connect(offline.destination)

for(let t=0;t<seconds;t+=beat*4)
generateOfflineBar(offline,compressor,t)

offline.startRendering().then(buffer=>{

const blob=bufferToWave(buffer)
const url=URL.createObjectURL(blob)

const a=document.createElement("a")
a.href=url
a.download="procedural_music.wav"
a.click()

})

}

function generateOfflineBar(ctx,dest,start){

const tempo=parseFloat(document.getElementById("tempo").value)
const beat=60/tempo

const scale=getScale()
const chords=buildChords(scale)

const prog=progressions[Math.floor(Math.random()*progressions.length)]
const chord=chords[prog[Math.floor(Math.random()*prog.length)]]

const padVol=parseFloat(document.getElementById("pad").value)
const noteVol=parseFloat(document.getElementById("noteVol").value)
const density=parseFloat(document.getElementById("density").value)

for(let n of chord){

const osc=ctx.createOscillator()
const gain=ctx.createGain()

osc.type="triangle"
osc.frequency.value=freq(n)

osc.connect(gain)
gain.connect(dest)

gain.gain.setValueAtTime(0,start)
gain.gain.linearRampToValueAtTime(padVol,start+0.02)
gain.gain.exponentialRampToValueAtTime(0.0001,start+beat*4)

osc.start(start)
osc.stop(start+beat*4)

}

for(let i=0;i<4;i++){

if(Math.random()<density){

const note=scale[Math.floor(Math.random()*scale.length)]

const osc=ctx.createOscillator()
const gain=ctx.createGain()

osc.type="sine"
osc.frequency.value=freq(note+12)

const t=start+i*beat

osc.connect(gain)
gain.connect(dest)

gain.gain.setValueAtTime(noteVol,t)
gain.gain.exponentialRampToValueAtTime(0.0001,t+beat)

osc.start(t)
osc.stop(t+beat)

}

}

}

function bufferToWave(buffer){

const numChannels=buffer.numberOfChannels
const sampleRate=buffer.sampleRate
const length=buffer.length*numChannels*2+44

const bufferArray=new ArrayBuffer(length)
const view=new DataView(bufferArray)

let offset=0

function writeString(str){
for(let i=0;i<str.length;i++)
view.setUint8(offset++,str.charCodeAt(i))
}

function writeUint32(val){view.setUint32(offset,val,true);offset+=4}
function writeUint16(val){view.setUint16(offset,val,true);offset+=2}

writeString("RIFF")
writeUint32(length-8)
writeString("WAVE")

writeString("fmt ")
writeUint32(16)
writeUint16(1)
writeUint16(numChannels)
writeUint32(sampleRate)
writeUint32(sampleRate*numChannels*2)
writeUint16(numChannels*2)
writeUint16(16)

writeString("data")
writeUint32(buffer.length*numChannels*2)

const channels=[]
for(let i=0;i<numChannels;i++)
channels.push(buffer.getChannelData(i))

for(let i=0;i<buffer.length;i++){
for(let ch=0;ch<numChannels;ch++){

let sample=channels[ch][i]
sample=Math.max(-1,Math.min(1,sample))
sample=sample<0?sample*0x8000:sample*0x7FFF

view.setInt16(offset,sample,true)
offset+=2

}
}

return new Blob([bufferArray],{type:"audio/wav"})

}

</script>

</body>
</html>
